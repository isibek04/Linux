name: Publish

on:
  schedule:
    # Every other day, on the even days of the month. Cron cannot express a
    # true 48-hour stride -- the day-of-month field resets each month -- so
    # the cadence slips by a day after 31-day months (30th -> 2nd).
    - cron: '30 05 2-30/2 * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Pushing to ghcr.io with the run's own token.
  packages: write
  # Keyless cosign: the run's OIDC token is what Fulcio issues the signing
  # certificate against. Nothing else in the workflow uses it.
  id-token: write

env:
  REGISTRY: ghcr.io
  # Named for the image, not the repository: the package is `os4` under the
  # repository owner, whatever the repository itself is called. Lowercased in
  # the meta step, since ghcr.io refuses uppercase and owners may have it.
  IMAGE_NAME: ${{ github.repository_owner }}/os4
  # A second package, `linux`, carrying the sealed images only: `linux:main`
  # is the very manifest `os4:main-sealed` is, and `linux:main-nvidia` is the
  # same sealed build with NVIDIA's driver in it. Lowercased the same way.
  LINUX_IMAGE_NAME: ${{ github.repository_owner }}/linux
  # The driver branch the -nvidia images are built with: 580 is the last that
  # drives Maxwell, Pascal and Volta. See build/nvidia.sh.
  NVIDIA_DRIVER: '580'
  # Every registry client in this workflow reads its credentials from here.
  # podman and skopeo both honour this variable, and the default shell below
  # carries it through sudo.
  REGISTRY_AUTH_FILE: /tmp/os4-auth-${{ github.run_id }}/auth.json

# Every podman and skopeo call in this job runs as root, so every `run:` does.
# Rootful because two things here cannot work rootless: build/verify-sealed.sh
# hands the store to a --privileged container that remounts its overlay, and
# the storage itself is moved onto /mnt below, which is a mount only root can
# make. --preserve-env keeps the step's env (secrets, REGISTRY_AUTH_FILE,
# GITHUB_OUTPUT) across the sudo; sudo's secure_path still resets PATH, which
# is why the cosign step, whose binary the installer action puts on the
# runner user's PATH, opts back out to plain bash.
defaults:
  run:
    shell: sudo --preserve-env bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    # A GitHub-hosted runner, built with its own podman. podman rather than
    # docker because every image here has to reach containers-storage in the
    # end -- it is the only store bootc reads, both for the verification below
    # and for the digest the sealed variant is built around. Going through the
    # docker daemon means a conversion on the way out (Docker schema 2 into an
    # OCI reader, which bootc fails on) and an image-sized copy to get it
    # there. podman builds into that store directly, and it is what this repo
    # is developed against locally, which is worth more than it sounds: the
    # mtime bug the sealed variant is built around hid for three runs behind
    # exactly that difference.
    #
    # Ubuntu 24.04 ships podman and skopeo in the runner image, so nothing is
    # installed for them. Each run starts from an empty store, so nothing is
    # cached between builds either: bootc compiles and texlive-full installs
    # from scratch every time.
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The image is ~11 GB, the sealed variant reuses most of it, and
      # verify-sealed.sh writes an image-sized composefs repo on top. The
      # runner's root filesystem has nowhere near that free out of the box.
      # Two things make room: the preinstalled toolchains nothing here uses
      # come off /, which is where TMPDIR (/var/tmp) and therefore both
      # scripts' scratch space lives; and the container store moves to /mnt,
      # the runner's second disk, which is otherwise idle.
      - name: Make room on the runner
        run: |
          df -h / /mnt
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                 /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
                 /usr/share/swift /usr/local/share/powershell /opt/microsoft || true
          docker system prune -af >/dev/null 2>&1 || true
          mkdir -p /mnt/containers /var/lib/containers
          mount --bind /mnt/containers /var/lib/containers
          df -h / /mnt

      - name: Compute image tags
        id: meta
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
          tags=""

          case "${{ github.event_name }}" in
            pull_request)
              tags="${image}:pr-${{ github.event.pull_request.number }}"
              ;;
            release)
              tags="${image}:latest"
              ;;
          esac

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="${tags} ${image}:main"
          fi

          # Semver fan-out for v* tags: vX.Y.Z -> X.Y.Z, X.Y, X
          case "${{ github.ref }}" in
            refs/tags/v*)
              v="${GITHUB_REF#refs/tags/v}"
              tags="${tags} ${image}:${v} ${image}:${v%.*} ${image}:${v%%.*}"
              ;;
          esac

          tags="$(echo $tags | xargs -n1 | sort -u | xargs)"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${tags}"

          # The sealed variant mirrors every tag with a -sealed suffix:
          # main-sealed, pr-N-sealed, X.Y.Z-sealed. Same repository, so the
          # two variants share layers in the registry.
          sealed=""
          for t in ${tags}; do
            sealed="${sealed} ${t}-sealed"
          done
          sealed="$(echo ${sealed} | xargs)"
          echo "sealed_tags=${sealed}" >> "$GITHUB_OUTPUT"
          echo "Resolved sealed tags: ${sealed}"

          # The linux package takes the same tag names without the suffix for
          # the sealed image -- linux:main is os4:main-sealed -- and with
          # -nvidia for the nvidia variant: linux:main-nvidia, linux:pr-N-nvidia.
          linux_image="$(echo "${REGISTRY}/${LINUX_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          linux="" nvidia=""
          for t in ${tags}; do
            linux="${linux} ${linux_image}:${t##*:}"
            nvidia="${nvidia} ${linux_image}:${t##*:}-nvidia"
          done
          linux="$(echo ${linux} | xargs)"
          nvidia="$(echo ${nvidia} | xargs)"
          echo "linux_image=${linux_image}" >> "$GITHUB_OUTPUT"
          echo "linux_tags=${linux}" >> "$GITHUB_OUTPUT"
          echo "nvidia_tags=${nvidia}" >> "$GITHUB_OUTPUT"
          echo "Resolved linux tags: ${linux}"
          echo "Resolved nvidia tags: ${nvidia}"

      # SB_LEAF_KEY reaches this build too, not just the sealed one below: the
      # v4l2loopback module DKMS builds in build/v4l2loopback.sh is signed
      # with the same leaf key the sealed variant's UKI uses (see README.md's
      # "v4l2loopback, and a module signature that is not the UKI's"), and
      # that step is part of the `rootfs` target, not the sealed-only stages.
      # Unset here the same way it can be for the sealed build below -- a
      # secret mount with an empty or absent env var yields an empty secret
      # file, not a build failure, and build/v4l2loopback.sh treats that as
      # "ship unsigned" rather than an error, which is what a pull request
      # from a fork, which gets no secrets, does.
      - name: Build image
        env:
          SB_LEAF_KEY: ${{ secrets.SB_LEAF_KEY }}
        run: |
          args=""
          for t in ${{ steps.meta.outputs.tags }}; do
            args="${args} --tag ${t}"
          done
          podman build \
            --pull \
            --format oci \
            --target rootfs \
            --secret id=sb_leaf_key,env=SB_LEAF_KEY \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            ${args} \
            --file Containerfile \
            .

      # The sealed variant: the same rootfs with kernel, initramfs and kargs
      # fused into a UKI signed by the Secure Boot leaf key
      # (usr/share/os4/secureboot -- the certificates are in the repo, only the
      # key is a secret). It reuses every layer the build above just made.
      #
      # Three steps rather than one `--target sealed`, because the UKI cannot
      # be built inside the image build at all: the composefs digest it embeds
      # has to be computed over the split image as committed, and a builder
      # hands out a live filesystem whose mtimes carry nanoseconds that no tar
      # can preserve. The Containerfile explains it above its uki-tools stage;
      # build/sign-uki.sh is what runs the tools against a mounted copy of the
      # committed image.
      #
      # Skipped when SB_LEAF_KEY is unset -- secrets-in-if is not
      # expression-safe, so the emptiness check lives in the step and later
      # steps key off the `built` output.
      - name: Build sealed image
        id: sealed
        env:
          SB_LEAF_KEY: ${{ secrets.SB_LEAF_KEY }}
        run: |
          if [ -z "${SB_LEAF_KEY}" ]; then
            echo "SB_LEAF_KEY not set -- skipping the sealed variant."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          split="os4-split:${{ github.run_id }}"
          tools="os4-uki-tools:${{ github.run_id }}"

          # The two inputs sign-uki.sh needs: the tree to seal, and the tools
          # to seal it with. Neither is published.
          #
          # split reuses the rootfs stage's layers, v4l2loopback's RUN
          # included -- the secret has to be passed again here for the same
          # reason it is above: whether that layer gets reused from the
          # "Build image" step's cache or rebuilt from scratch is not
          # something this step controls, and a cache miss without the
          # secret would sign the sealed variant's module with nothing.
          podman build --format oci --target split --tag "${split}" \
            --secret id=sb_leaf_key,env=SB_LEAF_KEY --file Containerfile .
          podman build --format oci --target uki-tools --tag "${tools}" --file Containerfile .

          # Produces uki-out/, a /boot overlay, which the sealed stage copies.
          ./build/sign-uki.sh "${split}" "${tools}"

          args=""
          for t in ${{ steps.meta.outputs.sealed_tags }}; do
            args="${args} --tag ${t}"
          done
          podman build \
            --format oci \
            --target sealed \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            ${args} \
            --file Containerfile \
            .
          echo "built=true" >> "$GITHUB_OUTPUT"

      # The nvidia variant: the sealed image again, with NVIDIA_DRIVER set.
      # The Containerfile declares that ARG just after v4l2loopback, so every
      # layer above it comes from the builds above and only the tail is built
      # again -- the driver, then the initramfs, bootc-rootfs.sh and the split,
      # all of which see it. Then a UKI of its own: a different tree is a
      # different composefs digest, so sign-uki.sh runs again over this split
      # and replaces uki-out/, which the main sealed image no longer needs.
      #
      # Only when the sealed variant was built, which also means the key is
      # there: the -nvidia tags are sealed images or nothing.
      #
      # continue-on-error, and the job failed at the end instead, for the
      # reason the sealed verification below gives: this variant depends on a
      # third-party repository the other images never touch, and its failure
      # must not stop them being published.
      - name: Build nvidia image
        id: nvidia
        if: steps.sealed.outputs.built == 'true'
        continue-on-error: true
        env:
          SB_LEAF_KEY: ${{ secrets.SB_LEAF_KEY }}
        run: |
          split="os4-split-nvidia:${{ github.run_id }}"
          tools="os4-uki-tools:${{ github.run_id }}"

          podman build --format oci --target split --tag "${split}" \
            --build-arg "NVIDIA_DRIVER=${NVIDIA_DRIVER}" \
            --secret id=sb_leaf_key,env=SB_LEAF_KEY --file Containerfile .

          ./build/sign-uki.sh "${split}" "${tools}"

          args=""
          for t in ${{ steps.meta.outputs.nvidia_tags }}; do
            args="${args} --tag ${t}"
          done
          podman build \
            --format oci \
            --target sealed \
            --build-arg "NVIDIA_DRIVER=${NVIDIA_DRIVER}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            ${args} \
            --file Containerfile \
            .
          echo "built=true" >> "$GITHUB_OUTPUT"

      # A sealed image whose UKI does not match the tree it ships builds, signs
      # and pushes perfectly, and then no machine will take it:
      #
      #   The UKI has the wrong composefs= parameter (is '02e186...', should
      #   be '936f0e...')
      #
      # Which is how the first sealed images shipped, three runs of it. The
      # step above is built so that cannot happen again; this is what proves
      # it, by running the check a host runs against the finished image, and
      # printing the differing dumpfile entries when it fails so the next
      # occurrence arrives diagnosed. It runs on pull requests too, where the
      # sealed image is built and not pushed: catching it there is the point.
      #
      # The result is recorded rather than thrown, and the job is failed at the
      # very end. A broken sealed variant withholds the `-sealed` tags and
      # nothing else: the main tags are what deployed machines upgrade from,
      # and stopping their publish over a variant no machine runs yet would be
      # the more expensive failure.
      #
      # Not free: hashing writes every file object into a throwaway composefs
      # repo, so it wants image-sized scratch space -- which is what the
      # cleanup of / at the top of the job is for. See build/verify-sealed.sh.
      - name: Verify the sealed image is installable
        id: verify
        if: steps.sealed.outputs.built == 'true'
        run: |
          set -- ${{ steps.meta.outputs.sealed_tags }}
          if [ "$#" -eq 0 ]; then
            echo "No sealed tags resolved for this event -- nothing to verify."
            exit 0
          fi
          # Every sealed tag is the same manifest, so one is the whole check.
          if ./build/verify-sealed.sh "$1"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # The same check for the nvidia variant, recorded the same way.
      - name: Verify the nvidia image is installable
        id: verify_nvidia
        if: steps.nvidia.outputs.built == 'true'
        run: |
          set -- ${{ steps.meta.outputs.nvidia_tags }}
          if [ "$#" -eq 0 ]; then
            echo "No nvidia tags resolved for this event -- nothing to verify."
            exit 0
          fi
          if ./build/verify-sealed.sh "$1"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # PRs build only -- no push.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$(dirname "${REGISTRY_AUTH_FILE}")"
          printf '%s' "${REGISTRY_TOKEN}" \
            | podman login "${REGISTRY}" \
                --username "${{ github.actor }}" \
                --password-stdin

      # Pushed with skopeo, not `podman push`, because the media types matter.
      # podman push follows the stored manifest and has no flag to force OCI on
      # the wire. bootc reads an image back out of containers-storage
      # through skopeo's image proxy, which presents whatever is stored as OCI --
      # and an OCI manifest needs an OCI config, re-encoded to a digest that
      # storage never held a blob for. `bootc install` then dies before writing
      # anything, asking for a config that does not exist:
      #
      #   failed to invoke method GetBlob: locating item named "sha256:1d7d..."
      #   for image with ID "..." (consider removing the image to resolve the
      #   issue): file does not exist
      #
      # Removing and re-pulling the image does not help: the digest is derived,
      # so it comes back identical every time. `--format oci` is the fix, on
      # both ends -- the builds above ask for it too, so what is stored and
      # what is pushed agree.
      #
      # The first tag is streamed out of the local store; the rest are copied
      # registry-side off that one, so the layers upload once.
      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        run: |
          auth="${REGISTRY_AUTH_FILE}"
          digestfile="$(mktemp)"

          set -- ${{ steps.meta.outputs.tags }}
          if [ "$#" -eq 0 ]; then
            echo "No tags resolved for this event -- nothing to push."
            exit 0
          fi
          first="$1"
          shift

          skopeo copy --format oci \
            --dest-authfile "${auth}" \
            --digestfile "${digestfile}" \
            "containers-storage:${first}" "docker://${first}"

          for t in "$@"; do
            skopeo copy --format oci \
              --src-authfile "${auth}" --dest-authfile "${auth}" \
              "docker://${first}" "docker://${t}"
          done

          digest="$(cat "${digestfile}")"
          echo "Pushed ${digest} as: ${first} $*"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${first%:*}" >> "$GITHUB_OUTPUT"

      # Same push, for the sealed variant -- to its -sealed tags in os4 and to
      # the plain ones in linux. One manifest, so one digest for both, copied
      # registry-side off the first tag like every other tag here.
      - name: Push sealed image
        id: push_sealed
        if: github.event_name != 'pull_request' && steps.verify.outputs.ok == 'true'
        run: |
          auth="${REGISTRY_AUTH_FILE}"
          digestfile="$(mktemp)"

          set -- ${{ steps.meta.outputs.sealed_tags }} ${{ steps.meta.outputs.linux_tags }}
          if [ "$#" -eq 0 ]; then
            echo "No sealed tags resolved for this event -- nothing to push."
            exit 0
          fi
          first="$1"
          shift

          skopeo copy --format oci \
            --dest-authfile "${auth}" \
            --digestfile "${digestfile}" \
            "containers-storage:${first}" "docker://${first}"

          for t in "$@"; do
            skopeo copy --format oci \
              --src-authfile "${auth}" --dest-authfile "${auth}" \
              "docker://${first}" "docker://${t}"
          done

          digest="$(cat "${digestfile}")"
          echo "Pushed ${digest} as: ${first} $*"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Same push, for the nvidia variant.
      - name: Push nvidia image
        id: push_nvidia
        if: github.event_name != 'pull_request' && steps.verify_nvidia.outputs.ok == 'true'
        run: |
          auth="${REGISTRY_AUTH_FILE}"
          digestfile="$(mktemp)"

          set -- ${{ steps.meta.outputs.nvidia_tags }}
          if [ "$#" -eq 0 ]; then
            echo "No nvidia tags resolved for this event -- nothing to push."
            exit 0
          fi
          first="$1"
          shift

          skopeo copy --format oci \
            --dest-authfile "${auth}" \
            --digestfile "${digestfile}" \
            "containers-storage:${first}" "docker://${first}"

          for t in "$@"; do
            skopeo copy --format oci \
              --src-authfile "${auth}" --dest-authfile "${auth}" \
              "docker://${first}" "docker://${t}"
          done

          digest="$(cat "${digestfile}")"
          echo "Pushed ${digest} as: ${first} $*"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request' && steps.push.outputs.digest != ''
        uses: sigstore/cosign-installer@v3

      # Keyless: no key pair and no secret. cosign trades the run's OIDC token
      # for a short-lived Fulcio certificate naming this workflow, this
      # repository and the ref it ran on, signs with it, and records the
      # signature in the public Rekor log. Verifying means naming that
      # identity rather than holding a public key; README.md has the command.
      #
      # Public is meant literally: the Rekor entry carries the certificate, so
      # the repository and workflow path become publicly visible even while
      # the repository is private.
      #
      # Signed once per repository, by digest, rather than once per tag: every
      # tag resolves to the same manifest. Once per repository because cosign
      # keeps a signature next to the image in the repository it was asked
      # about -- the sealed manifest is signed in os4 and again in linux. The digest comes from the push step -- `podman
      # inspect` reports what the local store holds, and the store is not what
      # the registry sees.
      - name: Sign the published image
        if: github.event_name != 'pull_request' && steps.push.outputs.digest != ''
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          # Empty when the sealed variant was skipped or not pushed; the same
          # image repository either way, so IMAGE serves both.
          DIGEST_SEALED: ${{ steps.push_sealed.outputs.digest }}
          LINUX_IMAGE: ${{ steps.meta.outputs.linux_image }}
          # Empty when the nvidia variant was skipped, failed or not pushed.
          DIGEST_NVIDIA: ${{ steps.push_nvidia.outputs.digest }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" \
            | cosign login "${REGISTRY}" --username "${{ github.actor }}" --password-stdin
          cosign sign --yes "${IMAGE}@${DIGEST}"
          if [ -n "${DIGEST_SEALED}" ]; then
            cosign sign --yes "${IMAGE}@${DIGEST_SEALED}"
            cosign sign --yes "${LINUX_IMAGE}@${DIGEST_SEALED}"
          fi
          if [ -n "${DIGEST_NVIDIA}" ]; then
            cosign sign --yes "${LINUX_IMAGE}@${DIGEST_NVIDIA}"
          fi

      # Last, so that everything the sealed variant does not affect has already
      # happened: the main tags are pushed and signed, and only then does the
      # job go red over an image it declined to publish.
      - name: Fail if the sealed image did not verify
        if: steps.verify.outputs.ok == 'false'
        run: |
          echo "The sealed variant was built but not published: its UKI is" >&2
          echo "sealed against a different tree than the image itself. See the" >&2
          echo "dumpfile diff in the verification step above." >&2
          exit 1

      - name: Fail if the nvidia image did not build or verify
        if: steps.nvidia.outcome == 'failure' || steps.verify_nvidia.outputs.ok == 'false'
        run: |
          echo "The nvidia variant was not published: it failed to build, or its" >&2
          echo "UKI did not verify. See the 'Build nvidia image' and 'Verify the" >&2
          echo "nvidia image is installable' steps above." >&2
          exit 1
