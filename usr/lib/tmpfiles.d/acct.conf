# accton(8) opens its target file with acct(2), which -- unlike the postinst
# script that normally sets this up -- does not create it: the path must
# already exist or acct.service fails with ENOENT. See the acct paragraph by
# the package's install line in the Containerfile for why bootc-rootfs.sh's
# generated tmpfiles entries do not already cover this file.
f /var/log/account/pacct 0640 root adm -
