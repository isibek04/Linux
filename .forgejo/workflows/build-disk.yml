name: Build Disk Image

# Manual-only: builds an installable disk image from a published container
# image and uploads it to the Hetzner object storage bucket that Forgejo itself
# stores packages in (sibling prefix, per .forgejo/README.md).
#
# os3's equivalent workflow builds an anaconda-iso. That is not an option here:
# anaconda is Fedora's installer and knows nothing about a Debian root, so
# there is no installer ISO to produce. A raw or qcow2 disk image is the
# portable alternative -- write the raw one to a disk with dd, or boot the
# qcow2 under a hypervisor.
#
# bootc-image-builder's Debian support is untested by upstream; if the build
# fails here rather than in the image, that is the likely reason, and
# `bootc install to-disk` run from the image itself is the fallback.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag of the published container image to build from'
        required: false
        default: 'main'
      disk_type:
        description: 'Disk image format to produce'
        required: false
        default: 'qcow2'

concurrency:
  group: build-disk
  cancel-in-progress: false

env:
  REGISTRY: git.sebz.me
  IMAGE_NAME: ${{ github.repository }}
  S3_ENDPOINT: nbg1.your-objectstorage.com
  S3_BUCKET: sebz-me-storage
  S3_PREFIX: artifacts/os4

jobs:
  disk:
    # `hetzner-host` is a host-mode label on the ephemeral Hetzner runner:
    # bootc-image-builder needs a privileged container with loop devices,
    # which the unprivileged docker job containers cannot provide. Host mode
    # has no node, so no JS actions (checkout included) in this job --
    # everything is plain shell + docker, and nothing here needs the repo
    # contents anyway.
    runs-on: hetzner-host

    steps:
      - name: Resolve image reference
        id: ref
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          tag="${tag:-main}"
          type="${{ inputs.disk_type }}"
          type="${type:-qcow2}"
          case "$type" in
            qcow2|raw|vmdk) ;;
            *) echo "Unsupported disk_type: $type" >&2; exit 1 ;;
          esac
          image="${REGISTRY}/${IMAGE_NAME}"
          image="$(echo "$image" | tr '[:upper:]' '[:lower:]'):${tag}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "type=${type}" >> "$GITHUB_OUTPUT"
          echo "Building ${type} from ${image}"

      - name: Pull image into shared containers-storage
        run: |
          set -euo pipefail
          work="${{ github.workspace }}"
          mkdir -p "$work/containers" "$work/output"

          # Registry auth is optional -- skipped when the package is public.
          authmount=""
          if [ -n "${{ secrets.REGISTRY_USER }}" ]; then
            auth="$(printf '%s:%s' '${{ secrets.REGISTRY_USER }}' '${{ secrets.REGISTRY_TOKEN }}' | base64 -w0)"
            printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$auth" > "$work/auth.json"
            chmod 600 "$work/auth.json"
            authmount="-v $work/auth.json:/run/containers/0/auth.json:ro"
          fi

          # osbuild attaches loop devices; make sure the host has them before
          # handing /dev to a privileged container.
          modprobe loop || true

          docker run --rm --privileged \
            -v "$work/containers:/var/lib/containers/storage" \
            $authmount \
            quay.io/podman/stable:latest \
            podman pull "${{ steps.ref.outputs.image }}"

      - name: Build disk image
        run: |
          set -euo pipefail
          work="${{ github.workspace }}"
          authmount=""
          [ -f "$work/auth.json" ] && authmount="-v $work/auth.json:/run/containers/0/auth.json:ro"

          docker run --rm --privileged \
            -v "$work/containers:/var/lib/containers/storage" \
            -v "$work/output:/output" \
            $authmount \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type "${{ steps.ref.outputs.type }}" \
            "${{ steps.ref.outputs.image }}"

          find "$work/output" -type f -printf '%s\t%p\n' | sort -rn | head

      - name: Upload to object storage
        run: |
          set -euo pipefail
          work="${{ github.workspace }}"
          type="${{ steps.ref.outputs.type }}"
          tag="${{ inputs.image_tag }}"
          tag="${tag:-main}"

          # bootc-image-builder lays its output out per type: qcow2/disk.qcow2,
          # image/disk.raw, vmdk/disk.vmdk. Find it rather than guessing.
          disk="$(find "$work/output" -type f -name "disk.*" | head -n1)"
          if [ -z "$disk" ]; then
            echo "No disk image produced" >&2
            find "$work/output" -type f >&2
            exit 1
          fi

          name="os4-${tag}-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}.${type}"
          dir="$(dirname "$disk")"
          mv "$disk" "${dir}/${name}"
          ( cd "$dir" && sha256sum "${name}" > "${name}.sha256" )

          # mc rather than the aws CLI: it multiparts large files automatically
          # and does not send the newer AWS checksum headers that Hetzner's
          # Ceph-based object storage rejects (same reason app.ini pins
          # MINIO_CHECKSUM_ALGORITHM = md5).
          upload() {
            docker run --rm \
              -v "${dir}:/data:ro" \
              -e MC_HOST_s3="https://${{ secrets.S3_ACCESS_KEY_ID }}:${{ secrets.S3_SECRET_ACCESS_KEY }}@${S3_ENDPOINT}" \
              quay.io/minio/mc:latest \
              cp "/data/$1" "s3/${S3_BUCKET}/${S3_PREFIX}/$1"
          }
          upload "${name}"
          upload "${name}.sha256"
          echo "Uploaded s3://${S3_BUCKET}/${S3_PREFIX}/${name}"

      # The ephemeral server lives ~5 more minutes and may take the next job;
      # don't leave ~30 GB of build residue behind for it.
      - name: Clean up
        if: always()
        run: |
          rm -rf "${{ github.workspace }}/containers" "${{ github.workspace }}/output" "${{ github.workspace }}/auth.json" || true
          df -h / | tail -1
