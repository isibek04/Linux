name: Cleanup Old Package Versions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: cleanup-packages
  cancel-in-progress: false

env:
  FORGEJO_URL: ${{ github.server_url }}
  OWNER: ${{ github.repository_owner }}
  # Package name as it appears in the registry. The publish workflow pushes to
  # ${REGISTRY}/${github.repository}, so this is the repo name, lowercased.
  PACKAGE_NAME: os4
  MIN_VERSIONS_TO_KEEP: '10'
  MAX_AGE_DAYS: '30'

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      # node:22-bookworm ships curl but not jq.
      - name: Install jq
        run: |
          command -v jq >/dev/null 2>&1 || {
            apt-get update -qq && apt-get install -y -qq jq
          }

      # actions/delete-package-versions is GitHub-API-only and does not work
      # against Forgejo, so this drives Forgejo's package API directly.
      - name: Delete old container versions
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          api() {
            curl -sSf -H "Authorization: token ${TOKEN}" "$@"
          }

          # Tags that must never be pruned.
          protected='^(latest|main|v?[0-9]+(\.[0-9]+){0,2})$'

          cutoff="$(date -u -d "${MAX_AGE_DAYS} days ago" +%s)"

          page=1
          all='[]'
          while :; do
            batch="$(api "${FORGEJO_URL}/api/v1/packages/${OWNER}?type=container&q=${PACKAGE_NAME}&page=${page}&limit=50")"
            count="$(echo "$batch" | jq 'length')"
            [ "$count" -eq 0 ] && break
            all="$(jq -s 'add' <(echo "$all") <(echo "$batch"))"
            page=$((page + 1))
          done

          # Exact name match only -- ?q= is a substring search.
          all="$(echo "$all" | jq --arg n "${PACKAGE_NAME}" '[.[] | select(.name == $n)]')"

          total="$(echo "$all" | jq 'length')"
          echo "Found ${total} version(s) of ${PACKAGE_NAME}."

          # Newest first, so the first MIN_VERSIONS_TO_KEEP are always retained.
          candidates="$(echo "$all" | jq -r \
            --argjson keep "${MIN_VERSIONS_TO_KEEP}" \
            --argjson cutoff "${cutoff}" \
            'sort_by(.created_at) | reverse
             | .[$keep:]
             | .[] | select((.created_at | fromdateiso8601) < $cutoff)
             | .version')"

          if [ -z "$candidates" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          echo "$candidates" | while read -r version; do
            [ -z "$version" ] && continue
            if echo "$version" | grep -qE "$protected"; then
              echo "Keeping protected tag: ${version}"
              continue
            fi
            echo "Deleting ${PACKAGE_NAME}:${version}"
            api -X DELETE \
              "${FORGEJO_URL}/api/v1/packages/${OWNER}/container/${PACKAGE_NAME}/${version}" \
              -o /dev/null
          done
