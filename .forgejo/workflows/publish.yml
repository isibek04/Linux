name: Publish

on:
  schedule:
    # Every other day, on the even days of the month. Cron cannot express a
    # true 48-hour stride -- the day-of-month field resets each month -- so
    # the cadence slips by a day after 31-day months (30th -> 2nd).
    - cron: '30 05 2-30/2 * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: git.sebz.me
  IMAGE_NAME: ${{ github.repository }}
  # Every registry client in this workflow reads its credentials from here.
  # Not $HOME/.docker: the runner executes in host mode with HOME unset, so
  # `${HOME}/.docker/config.json` under `set -u` aborts the step with
  # "HOME: unbound variable". An explicit path removes the question.
  DOCKER_CONFIG: /tmp/os4-docker-${{ github.run_id }}
  # forgejo-runner gives the job a pseudo-terminal, so BuildKit picks its TTY
  # progress mode and redraws the step table in place several times a second.
  # A terminal collapses those frames into one block; a captured log keeps
  # every one of them, wrapped in cursor-up escapes -- tens of thousands of
  # lines for a build whose real output is a few hundred. `plain` is the
  # append-only mode, which is what a log wants.
  BUILDKIT_PROGRESS: plain

jobs:
  build:
    # Runs directly on the ephemeral Hetzner runner host (`hetzner-host`
    # label) and builds with the host's docker. The earlier nested-podman
    # approach only worked under the retired on-host rootless-podman runner;
    # forge-autoscale's job containers are docker/runc with the default
    # seccomp profile, which blocks the user-namespace clone nested podman
    # needs ("cannot clone: Operation not permitted / cannot re-exec
    # process"). Host mode has no node, so no JS actions here — the repo is
    # cloned by hand.
    runs-on: hetzner-host

    steps:
      - name: Clone repository
        env:
          # Fail fast instead of prompting on the job's pseudo-terminal —
          # an unauthenticated fetch of this private repo otherwise hangs
          # forever on an invisible username prompt.
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          rm -rf src
          git init -q src
          cd src
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          # The repo is private: authenticate with the run's token, the same
          # way actions/checkout does.
          auth="$(printf 'x-access-token:%s' '${{ github.token }}' | base64 -w0)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            ref="refs/pull/${{ github.event.pull_request.number }}/head"
          else
            ref="${GITHUB_REF}"
          fi
          git -c http.extraheader="Authorization: Basic ${auth}" \
            fetch -q --depth=1 origin "$ref"
          git checkout -q FETCH_HEAD

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
          tags=""

          case "${{ github.event_name }}" in
            pull_request)
              tags="${image}:pr-${{ github.event.pull_request.number }}"
              ;;
            release)
              tags="${image}:latest"
              ;;
          esac

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="${tags} ${image}:main"
          fi

          # Semver fan-out for v* tags: vX.Y.Z -> X.Y.Z, X.Y, X
          case "${{ github.ref }}" in
            refs/tags/v*)
              v="${GITHUB_REF#refs/tags/v}"
              tags="${tags} ${image}:${v} ${image}:${v%.*} ${image}:${v%%.*}"
              ;;
          esac

          tags="$(echo $tags | xargs -n1 | sort -u | xargs)"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${tags}"

          # The sealed variant mirrors every tag with a -sealed suffix:
          # main-sealed, pr-N-sealed, X.Y.Z-sealed. Same repository, so the
          # two variants share layers in the registry.
          sealed=""
          for t in ${tags}; do
            sealed="${sealed} ${t}-sealed"
          done
          sealed="$(echo ${sealed} | xargs)"
          echo "sealed_tags=${sealed}" >> "$GITHUB_OUTPUT"
          echo "Resolved sealed tags: ${sealed}"

      - name: Build image
        run: |
          set -euo pipefail
          cd src
          args=""
          for t in ${{ steps.meta.outputs.tags }}; do
            args="${args} --tag ${t}"
          done
          docker build \
            --pull \
            --target rootfs \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            ${args} \
            --file Containerfile \
            .

      # The sealed variant: same rootfs, with kernel, initramfs and kargs
      # fused into a UKI signed by the Secure Boot leaf key
      # (usr/share/os4/secureboot -- the certificates are in the repo, only
      # the key is a secret). It reuses every layer the build above just
      # made, so this is the split + ukify + sbsign stages on top.
      #
      # The key crosses into the build as a BuildKit secret, mounted for one
      # RUN and absent from every layer. Skipped when SB_LEAF_KEY is unset,
      # the same arrangement signing has with COSIGN_PRIVATE_KEY --
      # secrets-in-if is not expression-safe, so the emptiness check lives in
      # the script and later steps key off the `built` output.
      - name: Build sealed image
        id: sealed
        env:
          SB_LEAF_KEY: ${{ secrets.SB_LEAF_KEY }}
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          if [ -z "${SB_LEAF_KEY}" ]; then
            echo "SB_LEAF_KEY not set -- skipping the sealed variant."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd src
          args=""
          for t in ${{ steps.meta.outputs.sealed_tags }}; do
            args="${args} --tag ${t}"
          done
          docker build \
            --target sealed \
            --secret id=sb_leaf_key,env=SB_LEAF_KEY \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            ${args} \
            --file Containerfile \
            .
          echo "built=true" >> "$GITHUB_OUTPUT"

      # skopeo does two jobs here: it pushes (docker push writes Docker schema 2
      # manifests, and bootc cannot install those -- see the push step), and it
      # is how the verification below hands the sealed image to bootc. Its own
      # step, ahead of both, so that one missing tool is reported once.
      #
      # The runner snapshot carries skopeo (CI/scripts/provision-runner.sh).
      # This installs it anyway, for a VM booted from a snapshot predating that
      # change. Output is not swallowed: a silent apt failure here reads as
      # "skopeo is required", which says nothing about why.
      - name: Ensure skopeo is present
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            echo "skopeo not on the runner -- installing it."
            sudo=""
            [ "$(id -u)" -eq 0 ] || sudo=sudo
            export DEBIAN_FRONTEND=noninteractive
            if command -v apt-get >/dev/null 2>&1; then
              $sudo apt-get update -q || true
              $sudo apt-get install -yq skopeo || true
            elif command -v dnf >/dev/null 2>&1; then
              $sudo dnf install -y skopeo || true
            fi
          fi
          if ! command -v skopeo >/dev/null 2>&1; then
            echo "skopeo is required: docker push cannot write OCI media types," >&2
            echo "and a schema 2 image in the registry cannot be installed by" >&2
            echo "bootc -- it dies looking for a config blob that does not" >&2
            echo "exist. Add skopeo to the runner snapshot." >&2
            exit 1
          fi

      # The composefs digest embedded in the UKI is computed inside the build,
      # over a bind-mounted snapshot of the split stage; the digest a host
      # computes comes from the layers that were committed. When those two
      # trees are not identical, the image builds, signs and pushes perfectly
      # and then no machine will take it:
      #
      #   The UKI has the wrong composefs= parameter (is '02e186...', should
      #   be '936f0e...')
      #
      # Which is how the first sealed images shipped. This runs the check a host
      # runs, against the finished image, and prints the differing dumpfile
      # entries when it fails, so the next occurrence arrives diagnosed. It
      # runs on pull requests too, where the sealed image is built and not
      # pushed: catching it there is the point.
      #
      # The result is recorded rather than thrown, and the job is failed at the
      # very end. A broken sealed variant withholds the `-sealed` tags and
      # nothing else: the main tags are what deployed machines upgrade from,
      # and stopping their publish over a variant no machine runs yet would be
      # the more expensive failure.
      #
      # Not free: the image is copied into containers-storage for bootc to
      # read, and hashing it writes every file object into a throwaway
      # composefs repo. See build/verify-sealed.sh.
      - name: Verify the sealed image is installable
        id: verify
        if: steps.sealed.outputs.built == 'true'
        run: |
          set -euo pipefail
          cd src
          set -- ${{ steps.meta.outputs.sealed_tags }}
          if [ "$#" -eq 0 ]; then
            echo "No sealed tags resolved for this event -- nothing to verify."
            exit 0
          fi
          # Every sealed tag is the same manifest, so one is the whole check.
          if ./build/verify-sealed.sh "$1"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # PRs build only -- no push, matching the GitHub workflow's behaviour.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${DOCKER_CONFIG}"
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login "${REGISTRY}" \
                --username "${{ secrets.REGISTRY_USER }}" \
                --password-stdin

      # Pushed with skopeo, not `docker push`, because the media types matter.
      # docker push always writes a Docker schema 2 manifest and has no flag to
      # do otherwise. bootc reads an image back out of containers-storage
      # through skopeo's image proxy, which presents whatever is stored as OCI --
      # and an OCI manifest needs an OCI config, re-encoded to a digest that
      # storage never held a blob for. `bootc install` then dies before writing
      # anything, asking for a config that does not exist:
      #
      #   failed to invoke method GetBlob: locating item named "sha256:1d7d..."
      #   for image with ID "..." (consider removing the image to resolve the
      #   issue): file does not exist
      #
      # Removing and re-pulling the image does not help: the digest is derived,
      # so it comes back identical every time. `--format oci` is the fix, and it
      # is why a locally built image (podman build defaults to OCI) installed
      # fine while the published one never could.
      #
      # The first tag is streamed out of the docker daemon; the rest are copied
      # registry-side off that one, so the layers upload once.
      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          auth="${DOCKER_CONFIG}/config.json"
          digestfile="$(mktemp)"

          set -- ${{ steps.meta.outputs.tags }}
          if [ "$#" -eq 0 ]; then
            echo "No tags resolved for this event -- nothing to push."
            exit 0
          fi
          first="$1"
          shift

          skopeo copy --format oci \
            --dest-authfile "${auth}" \
            --digestfile "${digestfile}" \
            "docker-daemon:${first}" "docker://${first}"

          for t in "$@"; do
            skopeo copy --format oci \
              --src-authfile "${auth}" --dest-authfile "${auth}" \
              "docker://${first}" "docker://${t}"
          done

          digest="$(cat "${digestfile}")"
          echo "Pushed ${digest} as: ${first} $*"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${first%:*}" >> "$GITHUB_OUTPUT"

      # Same push, for the sealed variant.
      - name: Push sealed image
        id: push_sealed
        if: github.event_name != 'pull_request' && steps.verify.outputs.ok == 'true'
        run: |
          set -euo pipefail
          auth="${DOCKER_CONFIG}/config.json"
          digestfile="$(mktemp)"

          set -- ${{ steps.meta.outputs.sealed_tags }}
          if [ "$#" -eq 0 ]; then
            echo "No sealed tags resolved for this event -- nothing to push."
            exit 0
          fi
          first="$1"
          shift

          skopeo copy --format oci \
            --dest-authfile "${auth}" \
            --digestfile "${digestfile}" \
            "docker-daemon:${first}" "docker://${first}"

          for t in "$@"; do
            skopeo copy --format oci \
              --src-authfile "${auth}" --dest-authfile "${auth}" \
              "docker://${first}" "docker://${t}"
          done

          digest="$(cat "${digestfile}")"
          echo "Pushed ${digest} as: ${first} $*"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Keyless cosign is not available on Forgejo: it needs a Fulcio-trusted
      # OIDC issuer, which Forgejo Actions does not provide. Signing therefore
      # uses a key pair. Skipped automatically when COSIGN_PRIVATE_KEY is unset.
      #
      # Signed once, by digest, rather than once per tag: every tag resolves to
      # the same manifest, so the old per-tag loop re-signed one digest N times.
      # The digest now comes from the push step -- `docker inspect` reports what
      # the local daemon holds, and the daemon is no longer what pushes.
      - name: Sign the published image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          # Empty when the sealed variant was skipped or not pushed; the same
          # image repository either way, so IMAGE serves both.
          DIGEST_SEALED: ${{ steps.push_sealed.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "COSIGN_PRIVATE_KEY not set -- skipping signing."
            exit 0
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            echo "cosign not installed on the runner host -- skipping signing."
            exit 0
          fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
          if [ -n "${DIGEST_SEALED}" ]; then
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST_SEALED}"
          fi

      # The ephemeral server lives ~5 more minutes and may take the next job;
      # keep its disk clean but leave tagged layers as cache for a queued
      # follow-up build.
      # Last, so that everything the sealed variant does not affect has already
      # happened: the main tags are pushed and signed, and only then does the
      # job go red over an image it declined to publish.
      - name: Fail if the sealed image did not verify
        if: steps.verify.outputs.ok == 'false'
        run: |
          echo "The sealed variant was built but not published: its UKI is" >&2
          echo "sealed against a different tree than the image itself. See the" >&2
          echo "dumpfile diff in the verification step above." >&2
          exit 1

      - name: Clean up
        if: always()
        run: |
          rm -rf src || true
          docker image prune -f || true
          df -h / | tail -1
